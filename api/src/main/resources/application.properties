spring.datasource.url=jdbc:postgresql://localhost:5432/game_station
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.location=private/tomtemp
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

gameStation.auth.rounds=11
gameStation.auth.secret=The_secret_length_must_be_at_least_256_bits
gameStation.auth.issuer=http://localhost:8080/
gameStation.auth.tokenExpiration=3600

gameStation.uploads.location=C:/HOMEWARE/titreCDA/Game Station/ui/public/images

gameStation.cors.allowedOrigins=http://localhost:5173

server.port=8080